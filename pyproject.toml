[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-orc"
version = "0.1.0"
description = "Start, watch and stop coding-agent CLI sessions (Claude Code, Codex, ...) from a mobile-friendly PWA"
readme = "README.md"
license = "LicenseRef-PolyForm-Noncommercial-1.0.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pyyaml",
    "pywebpush",
    # Forms with a file (the recording AIfred sends with what was said on the Echo Dot).
    "python-multipart",
    # The tunnels to other machines (HTTP and WebSocket over a socket); pywebpush brings it, too.
    "aiohttp",
]

[project.optional-dependencies]
test = [
    "pytest",
    "types-PyYAML",
    "httpx2",
]

[project.scripts]
agent-orc = "agent_orc.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_orc"]
# The built PWA is git-ignored but must ship in the wheel.
artifacts = ["src/agent_orc/static/**"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
# ruff and mypy come from the shared tools venv (~/.venv/devtools); mypy reads the types of this venv.
python_executable = "venv/bin/python"
files = ["src", "tests"]

# The web push libraries ship no type information.
[[tool.mypy.overrides]]
module = ["py_vapid", "pywebpush", "http_ece"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
