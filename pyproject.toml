[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-orc"
version = "0.1.0"
description = "Start, watch and stop coding-agent CLI sessions (Claude Code, Codex, ...) from a mobile-friendly PWA"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pyyaml",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "mypy",
    "types-PyYAML",
    "httpx2",
]

[project.scripts]
ai-orc = "ai_orc.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_orc"]
# The built PWA is git-ignored but must ship in the wheel.
artifacts = ["src/ai_orc/static/**"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
