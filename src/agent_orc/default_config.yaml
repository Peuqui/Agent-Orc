# Agent-Orc configuration.
# This file is the single source of all default values; `agent-orc setup` fills it in to
# ~/.config/agent-orc/config.yaml, where you adapt the rest.
# The password lives separately in credentials.json (`agent-orc set-password` changes it).

server:
  host: 127.0.0.1
  port: 8770
  # Send the login cookie over HTTPS only. Set to false only for plain-HTTP testing.
  cookie_secure: true

auth:
  session_days: 30
  # After this many failed logins in a row, logins are refused for lockout_minutes.
  max_failed_logins: 5
  lockout_minutes: 15

files:
  # The file manager and new agent folders stay inside this directory.
  # (Settings in the app can change it later; what is set there wins over this.)
  base_dir: ~/projects
  # The safety switch widens access to the home directory for this long.
  unlock_minutes: 10
  # Larger files are not opened in the editor.
  max_edit_bytes: 2097152

terminal:
  # Extra-keys bar shown above the on-screen keyboard, one list per row.
  # A key either sends a byte sequence (YAML escapes: "\e" is Esc) or is a sticky
  # modifier (ctrl or alt) that applies to the next key typed.
  keys:
    - - {label: Esc, send: "\e"}
      - {label: Tab, send: "\t"}
      - {label: "⇧Tab", send: "\e[Z"}
      - {label: Ctrl, modifier: ctrl}
      - {label: Alt, modifier: alt}
      - {label: "↑", send: "\e[A"}
      - {label: "↓", send: "\e[B"}
      - {label: "⏎", send: "\r"}
    - - {label: "^C", send: "\x03"}
      - {label: "←", send: "\e[D"}
      - {label: "→", send: "\e[C"}
      - {label: PgUp, send: "\e[5~"}
      - {label: PgDn, send: "\e[6~"}
      - {label: "/", send: "/"}
      - {label: "|", send: "|"}
      - {label: "~", send: "~"}
  # Text from the input field is sent first, Enter after this pause, so agents treat it
  # as typed text plus submit rather than as one pasted block.
  submit_delay_ms: 80
  # A long text is typed in pieces of this many characters, this many milliseconds apart (the
  # values below are the defaults): Claude Code takes one big chunk (about 800 characters on)
  # for a paste and wraps it as pasted content, which the agent may then refuse to follow.
  # type_chunk_chars: 200
  # type_chunk_delay_ms: 30
  # An agent with an `exit_command` is asked to end by itself first, when it is stopped or
  # restarted, and given this many seconds for it (the default below); what still runs after
  # that is killed.
  # exit_wait_seconds: 5
  # How much history the plain-text view (for selecting and copying) shows.
  text_history_lines: 5000

# Handover to a fresh session. Claude Code compacts the context by itself at about 97 % of the
# window, and the agent cannot see how full it is. From advice_percent on, the agent's card
# advises a handover, and while automatic handovers are off (settings menu) a push message says
# so once, early enough to ask for it. Claude Code compacts at about compact_percent of the window;
# once fewer than reserve_tokens are left before that, with automatic handovers on, the prompt
# below is typed into the agent by itself, also while it works (not while it waits for a
# permission); you are told when the handover is written. A reserve in tokens fits every window
# (2 % of a million are 20,000 tokens, of 200,000 only 4,000); on a small window it comes before
# advice_percent and then advises as well. Once per filling: a compaction or a new
# session starts anew. Asked for by hand earlier (the agent's ⋮ menu), early_prompt is typed.
# Both switches (automatic handovers, handing over to a fresh session) are on until switched off.
# With handing over to a fresh session switched on as well (settings menu), fresh_prompt asks for
# the handover in {file} (.agent-orc/handover.md in the agent's folder) and the end of the turn;
# once the file is written, Agent-Orc interrupts the agent (an agent asked in the middle of its
# work tends to go on), /clear starts a new conversation in the folder, and resume_prompt has it
# read the handover and go on. resume_prompt comes first in the new conversation, before anything
# another hook wakes it with: the profile's SessionStart hook agent-session-start puts it into
# the context before any turn runs; then it is typed as well, as the user's own word. Claude Code
# reads hooks when the agent starts: one started without the hook gets it typed right after
# /clear.
handover:
  advice_percent: 90
  compact_percent: 97
  reserve_tokens: 50000
  prompt: "Your context is nearly full: Claude Code will compact it shortly. Pause your task and write a handover document for the next session now, from what you know, without reading files first: goal, current state, decisions made, open tasks and next steps, with the files that matter. Save it in the project and tell me its path. Then go on in the same turn: if the next step of your task can be done, do it, without asking and without only announcing it. If it waits for something you do not control (a peer, a running job, a time), say in one sentence \"I am waiting for …\", set a background watcher that wakes you, and only then end the turn. After the compaction, carry on with the step from the summary at once, without recapping first."
  early_prompt: "Write a handover document for the next session: goal, current state, decisions made, open tasks and next steps, with the files that matter. Save it in the project and tell me its path. Then go on in the same turn: if the next step of a task you are in the middle of can be done, do it, without asking and without only announcing it. If it waits for something you do not control (a peer, a running job, a time), say in one sentence \"I am waiting for …\", set a background watcher that wakes you, and only then end the turn."
  fresh_prompt: "Your context is nearly full. Instead of letting Claude Code compact it, you hand over to a fresh session: write a handover document to {file} now (replace one that is there), from what you know, without reading files first, and short (about one page: the next session reads the files itself): goal, current state, decisions made, open tasks and the next step, with the files that matter. Also name what runs in the background (jobs, watchers) with its command and log file, so the next session can take it up again. Then end your turn without further work: Agent-Orc starts a new session right away that goes on from the document."
  resume_prompt: "This goes on from a handover: read {file}, the handover of your previous session in this folder, and carry on where it stopped. Set up again the background jobs and watchers it names, if they no longer run. If the next step can be done, do it, without only announcing it; if it waits for something you do not control, say in one sentence \"I am waiting for …\" and set a watcher that wakes you."

# How an agent's prompt cache is shown on its card: this many minutes before it expires, its age
# turns amber (the next message soon reads the whole context in again).
cache:
  warning_minutes: 10

# An agent stopped by its usage limit (Claude's StopFailure hook, see the claude profile) gets
# this prompt once the limit is reset; its card shows the planned resume, which can be removed.
limit_resume:
  prompt: "The usage limit has been reset. Continue where you stopped."
  delay_seconds: 60

# Notifications on your devices (switched on per device in the settings menu): an agent finished
# its answer or waits for you. Needs HTTPS (or localhost) and, on iPhones, the installed app.
push:
  # Contact the browser vendors' push services may write to (VAPID): mailto: or https: URL.
  # Put your own address here; Apple's push service is said to refuse placeholder addresses.
  contact: mailto:agent-orc@localhost
  time_to_live_seconds: 3600
  timeout_seconds: 10

# Dictation in the terminal's input field: the browser records, Agent-Orc hands the audio to a
# STT-Suite service (API: POST /transcribe) and puts the text into the field.
dictation:
  # null: no STT-Suite service, the browser's own speech recognition listens instead (Chrome;
  # it sends the audio to Google). Firefox has none, so the microphone is missing there.
  stt_url: http://127.0.0.1:5080
  language: de
  # CPU transcription of a long dictation can take a while.
  timeout_seconds: 300

# Answers read aloud on an Echo Dot, through AIfred's announce endpoint (POST /audio/announce):
# the paragraph for listening of an answer, spoken by the Echo plugin's voice. Remove the leading
# "#" to switch it on; the room is chosen in the settings menu from the rooms AIfred reports.
# announce:
#   url: http://127.0.0.1:8002/api
#   # A file next to this one with AIfred's ANNOUNCE_API_TOKEN, readable by you only (chmod 600).
#   token_file: announce-token
#   # AIfred refuses a longer text; Agent-Orc cuts an answer at a sentence below this.
#   max_chars: 1200
#   timeout_seconds: 30
#   # What the speech settings call this output.
#   label: Echo

# Answers read aloud by a TTS-Suite service (https://github.com/Peuqui/TTS-Suite): it picks the
# engine, cleans and cuts the text and sends audio back, which the browser plays. Remove the leading
# "#" to switch it on; it joins the engines of the speech settings, and the engines of the service
# (which speak, in which order, with which voice) are set in a window of their own there. The
# browser's own voices need nothing of this.
# tts_suite:
#   url: http://127.0.0.1:5090
#   # Only if the service wants a token for speaking (it does on a network): a file next to this one,
#   # readable by you only (chmod 600).
#   # token_file: tts-token
#   timeout_seconds: 120
#   # What the speech settings call this output.
#   label: TTS-Suite

# Speaking to an agent on the Echo Dot ("Hey Orc, ..."): AIfred posts what was said to
# POST /api/voice with the token below; the Echo asks back which agent it understood and the text
# is typed in after a spoken yes. Needs "announce". Remove the leading "#" to switch it on.
# voice:
#   # A file next to this one with a token AIfred sends as bearer token (chmod 600).
#   token_file: voice-token
#   # With no agent named, the text goes to the one that answered last, if within this.
#   window_minutes: 10
#   confirm_minutes: 2
#   # Of what was said, this many of the newest requests stay, with their recordings; a stopped
#   # agent's recordings go with it, the lines stay.
#   keep_entries: 200
#   # Recordings older than this many days go; the lines stay.
#   recording_days: 7
#   # How well a spoken name must match an agent's folder name (0 to 1).
#   name_similarity: 0.75
#   yes_words: [ja, jawohl, richtig, genau]
#   # After a no the text is kept and the agent is asked for again; a cancel word drops it.
#   no_words: [nein, falsch]
#   cancel_words: [abbrechen, vergiss]
#   ask_line: "An {agent}, richtig? Sag Hey Orc, ja oder Hey Orc, nein."
#   sent_line: "Gesendet an {agent}."
#   sent_busy_line: "{agent} arbeitet noch und meldet sich, wenn er fertig ist."
#   discarded_line: "Verworfen."
#   which_agent_line: "Welcher Agent dann? Sag Hey Orc und den Namen."
#   no_agent_line: "Ich weiß nicht, an welchen Agenten. Nenne den Namen zuerst."
#   no_summary_line: "{agent} ist fertig."

# Reading along in AI-Connect (the bridge between agent sessions) and writing to its agents as
# the user, through AI-Connect's program for JSON lines; its tokens stay in AI-Connect's own files.
# Remove the leading "#" to switch it on.
# peers:
#   command: [venv/bin/python, -m, observer_client.jsonl]
#   # AI-Connect's folder, where the command runs.
#   directory: ~/Projekte/AI-Connect
#   # Messages of this many past hours are shown when the page opens, at most "limit" of them.
#   hours: 24
#   limit: 300
#   # The agents see what you write as coming from User:<user_name>.
#   user_name: Ada

# Other machines that run an Agent-Orc of their own (set up there with a socket instead of a port,
# `agent-orc setup`; update them with deploy/deploy.sh). This one keeps an SSH tunnel to each and
# shows its app below /hosts/<name>/, so its agents appear next to this machine's own.
# Remove the leading "#" to switch it on.
# hosts:
#   Aragon:
#     # The arguments of ssh: its options and the destination. It must log in without asking (a key).
#     ssh: ["-p", "2222", "mp@10.0.0.2"]
#     # That machine's Agent-Orc socket (its server.socket), spelled out: ssh does not expand "~".
#     socket: /home/mp/.local/state/agent-orc/run/agent-orc.sock

tmux:
  # Dedicated tmux server socket, so Agent-Orc never touches your own tmux sessions.
  socket_name: agent-orc

# Agent profiles. Command arguments may contain the placeholder {name},
# which is replaced by the name of the folder the agent runs in.
# Claude reports model and context usage through `agent-orc statusline` as its status line, and
# through hooks whether it is working, has finished (agent-idle) or waits for a permission or an
# answer (agent-waiting, which notifies your devices); agent-permission offers each permission
# request on the agent's card too (the terminal still asks; whichever answers first decides);
# agent-tool-done takes a request answered in the terminal off the card again, agent-limited
# plans the resume after a usage limit, agent-compacting and agent-compacted mark an agent that
# shrinks its context as working (no Stop follows it), agent-session-start gives a new
# conversation after a handover its request first. All only for sessions started by Agent-Orc.
# Claude Code on other backends than Anthropic's, run by `agent-orc backend` (profiles below). A
# backend is a service that speaks Anthropic's Messages API: models on a server of your own
# (llama-swap in front of llama.cpp or vLLM) or in a cloud. Nothing is shared or switched between
# backends: every start is a process of its own whose environment says where it talks to, so
# agents on Anthropic's service, on a local server and in a cloud run side by side. (A server
# that swaps big models in and out, such as llama-swap with an exclusive group, lets only one of
# them be loaded: agents on different models of it push each other out.)
#   agent-orc backend models <backend>            the models on offer, one per line
#   agent-orc backend levels <backend> <model>    the levels a model takes
#   agent-orc backend run <backend> [<model>] ... Claude Code on it (more arguments go on to Claude)
# `agent-orc setup` writes the `backends` section (and a profile `claude-<backend>` under `agents`
# for each); the README ("Other backends") describes every key. Without one there is no section.
agents:
  claude:
    label: Claude Code
    start: [claude, --settings, "{settings}", --remote-control, "{name}"]
    resume: [claude, --settings, "{settings}", --continue, --remote-control, "{name}"]
    # Typed into the agent to end it by itself before it is stopped or restarted: only then does
    # Claude Code close its Remote Control session in the Claude app; a killed one stays there
    # as an offline entry until it is archived by hand.
    exit_command: /exit
    # Every earlier conversation in the folder (also from VS Code or a terminal) can be resumed.
    conversations:
      source: claude
      resume: [claude, --settings, "{settings}", --resume, "{conversation}", --remote-control, "{name}"]
    # Claude's own settings for the agent's settings file ({settings}), which also carries its
    # effort, ultracode and permission mode (only the last --settings counts).
    settings: &claude_settings
      statusLine:
        type: command
        command: agent-orc statusline
      hooks:
        SessionStart:
        - matcher: clear
          hooks:
          - type: command
            command: agent-orc agent-session-start
        UserPromptSubmit:
        - hooks:
          - type: command
            command: agent-orc agent-busy
          # On a backend with GPU-Orc: frees the cards for a model the server unloaded after its
          # idle time; may wait for a speech service to finish (GPU-Orc's caller_timeout_s).
          - type: command
            command: agent-orc agent-free-cards
            timeout: 900
        Stop:
        - hooks:
          - type: command
            command: agent-orc agent-idle
        PreCompact:
        - hooks:
          - type: command
            command: agent-orc agent-compacting
        PostCompact:
        - hooks:
          - type: command
            command: agent-orc agent-compacted
        Notification:
        - matcher: permission_prompt|elicitation_dialog
          hooks:
          - type: command
            command: agent-orc agent-waiting
        PermissionRequest:
        - matcher: ''
          hooks:
          - type: command
            command: agent-orc agent-permission
            timeout: 86400
        StopFailure:
        - matcher: rate_limit
          hooks:
          - type: command
            command: agent-orc agent-limited
        PostToolUse:
        - matcher: ''
          hooks:
          - type: command
            command: agent-orc agent-tool-done
            async: true
        PostToolUseFailure:
        - matcher: ''
          hooks:
          - type: command
            command: agent-orc agent-tool-done
            async: true
        PermissionDenied:
        - matcher: ''
          hooks:
          - type: command
            command: agent-orc agent-tool-done
            async: true
    # Starting an agent in a folder means trusting it: skip Claude's trust prompt.
    trust: claude
    # A further agent in the folder gets an AI-Connect name of its own (Host:Project-Suffix).
    env: {AI_CONNECT_PEER_SUFFIX: "{suffix}"}
    # Usage limits (five hours, week) as Claude reports them in its status line.
    quota: claude
    # The prompt cache lasts an hour after the last request (five minutes once the account is
    # over its quota, then nothing is typed). Switched on per agent (on its card), this prompt is
    # typed into a resting agent shortly before the hour is over: it reads the cache, which
    # starts the hour anew. At most max_pings in a row, then the agent goes cold. Claude Code
    # compacts a large resting context by itself 55 minutes in, so the prompt comes before that.
    keep_warm:
      prompt: "Keep-alive: answer with one word only."
      lead_minutes: 10
      max_pings: 4
    # Reasoning effort of each agent, handed over in its settings file at start.
    effort:
      levels: [low, medium, high, xhigh, max]
      # An agent without a level of its own starts with this one.
      default: medium
      # Ultracode: Claude plans multi-agent workflows for larger tasks by itself.
      ultracode: true
      # A running agent takes a new reasoning in place, without a restart (its background tasks
      # keep running): typed in once it is idle. /effort also rewrites the user's own settings
      # file, which Agent-Orc then puts back as it was.
      live:
        command: /effort {level}
        ultracode_command: /effort ultracode {state}
        protected_file: ~/.claude/settings.json
    # Permission mode each agent starts in (in its settings file): default asks before changes
    # and commands, acceptEdits takes file edits without asking, auto lets Claude decide what is
    # safe, plan only plans. An agent without a mode of its own starts in `default` below; inside
    # a session Shift+Tab switches.
    permission:
      modes: [default, acceptEdits, auto, plan]
      default: auto
  codex:
    label: Codex CLI
    start: [codex]
    resume: [codex, resume, --last]
  aider:
    label: Aider
    start: [aider]
    resume: [aider, --restore-chat-history]
  # A profile may offer a choice of models at start: "models" prints them (one per line), the
  # choice fills {model} in its commands; "effort.levels_command" prints the levels a model takes
  # (nothing: no level at all), "env" sets the agent's environment ({effort}: the folder's level).
  # The profiles `claude-<backend>` that `agent-orc setup` adds follow the same pattern (the
  # template is claude_backend_profile.yaml in the package).
  shell:
    label: Shell
    # A plain terminal: it may run next to the folder's agent (">_" on its card).
    terminal: true
    # A plain shell in the folder; it has no conversation to resume, resuming opens a new one.
    start: [bash]
    resume: [bash]
