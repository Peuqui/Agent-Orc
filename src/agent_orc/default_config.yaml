# Agent-Orc configuration.
# This file is the single source of all default values; `agent-orc setup` fills it in to
# ~/.config/agent-orc/config.yaml, where you adapt the rest.
# The password lives separately in credentials.json (`agent-orc set-password` changes it).

server:
  host: 127.0.0.1
  port: 8770
  # Send the login cookie over HTTPS only. Set to false only for plain-HTTP testing.
  cookie_secure: true

auth:
  session_days: 30
  # After this many failed logins in a row, logins are refused for lockout_minutes.
  max_failed_logins: 5
  lockout_minutes: 15

files:
  # The file manager and new agent folders stay inside this directory.
  base_dir: ~/projects
  # Allowed names for new or renamed files and folders.
  name_pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,99}$'
  # The safety switch widens access to the home directory for this long.
  unlock_minutes: 10
  # Larger files are not opened in the editor.
  max_edit_bytes: 2097152

terminal:
  # Extra-keys bar shown above the on-screen keyboard, one list per row.
  # A key either sends a byte sequence (YAML escapes: "\e" is Esc) or is a sticky
  # modifier (ctrl or alt) that applies to the next key typed.
  keys:
    - - {label: Esc, send: "\e"}
      - {label: Tab, send: "\t"}
      - {label: "⇧Tab", send: "\e[Z"}
      - {label: Ctrl, modifier: ctrl}
      - {label: Alt, modifier: alt}
      - {label: "↑", send: "\e[A"}
      - {label: "↓", send: "\e[B"}
      - {label: "⏎", send: "\r"}
    - - {label: "^C", send: "\x03"}
      - {label: "←", send: "\e[D"}
      - {label: "→", send: "\e[C"}
      - {label: PgUp, send: "\e[5~"}
      - {label: PgDn, send: "\e[6~"}
      - {label: "/", send: "/"}
      - {label: "|", send: "|"}
      - {label: "~", send: "~"}
  # Text from the input field is sent first, Enter after this pause, so agents treat it
  # as typed text plus submit rather than as one pasted block.
  submit_delay_ms: 80
  # A long text is typed in pieces of this many characters, this many milliseconds apart (the
  # values below are the defaults): Claude Code takes one big chunk (about 800 characters on)
  # for a paste and wraps it as pasted content, which the agent may then refuse to follow.
  # type_chunk_chars: 200
  # type_chunk_delay_ms: 30
  # How much history the plain-text view (for selecting and copying) shows.
  text_history_lines: 5000

# Handover advice: from this share of its context window on, an agent's card advises a handover
# to a fresh session. Shortly before a resting agent's prompt cache expires, a push message says
# so once, or, if switched on in the settings menu, the prompt below is typed into the agent by
# itself; it is told when the handover is written.
handover:
  threshold_percent: 50
  # Minutes before the cache expires (after one hour of rest, as a rule) the handover is due.
  lead_minutes: 10
  prompt: "Your context is getting large. Write a handover document for the next session: goal, current state, decisions made, open tasks and next steps, with the files that matter. Save it in the project and tell me its path."

# An agent stopped by its usage limit (Claude's StopFailure hook, see the claude profile) gets
# this prompt once the limit is reset; its card shows the planned resume, which can be removed.
limit_resume:
  prompt: "The usage limit has been reset. Continue where you stopped."
  delay_seconds: 60

# Notifications on your devices (switched on per device in the settings menu): an agent finished
# its answer or waits for you. Needs HTTPS (or localhost) and, on iPhones, the installed app.
push:
  # Contact the browser vendors' push services may write to (VAPID): mailto: or https: URL.
  # Put your own address here; Apple's push service is said to refuse placeholder addresses.
  contact: mailto:agent-orc@localhost
  time_to_live_seconds: 3600
  timeout_seconds: 10

# Dictation in the terminal's input field: the browser records, Agent-Orc hands the audio to a
# Whisper service (whisper-stt API: POST /transcribe) and puts the text into the field.
dictation:
  # null: no Whisper service, the browser's own speech recognition listens instead (Chrome;
  # it sends the audio to Google). Firefox has none, so the microphone is missing there.
  whisper_url: http://127.0.0.1:5080
  language: de
  # CPU transcription of a long dictation can take a while.
  timeout_seconds: 300

# Answers read aloud on an Echo Dot, through AIfred's announce endpoint (POST /audio/announce):
# the paragraph for listening of an answer, spoken by the Echo plugin's voice. Remove the leading
# "#" to switch it on; the room is chosen in the settings menu from the rooms AIfred reports.
# announce:
#   url: http://127.0.0.1:8002/api
#   # A file next to this one with AIfred's ANNOUNCE_API_TOKEN, readable by you only (chmod 600).
#   token_file: announce-token
#   # AIfred refuses a longer text; Agent-Orc cuts an answer at a sentence below this.
#   max_chars: 1200
#   timeout_seconds: 30
#   # What the speech settings call this output.
#   label: Echo

# Speaking to an agent on the Echo Dot ("Hey Orc, ..."): AIfred posts what was said to
# POST /api/voice with the token below; the Echo asks back which agent it understood and the text
# is typed in after a spoken yes. Needs "announce". Remove the leading "#" to switch it on.
# voice:
#   # A file next to this one with a token AIfred sends as bearer token (chmod 600).
#   token_file: voice-token
#   # With no agent named, the text goes to the one that answered last, if within this.
#   window_minutes: 10
#   confirm_minutes: 2
#   # Of what was said, this many of the newest requests stay, with their recordings.
#   keep_entries: 200
#   # How well a spoken name must match an agent's folder name (0 to 1).
#   name_similarity: 0.75
#   yes_words: [ja, jawohl, richtig, genau]
#   # After a no the text is kept and the agent is asked for again; a cancel word drops it.
#   no_words: [nein, falsch]
#   cancel_words: [abbrechen, vergiss]
#   ask_line: "An {agent}, richtig? Sag Hey Orc, ja oder Hey Orc, nein."
#   sent_line: "Gesendet an {agent}."
#   sent_busy_line: "{agent} arbeitet noch und meldet sich, wenn er fertig ist."
#   discarded_line: "Verworfen."
#   which_agent_line: "Welcher Agent dann? Sag Hey Orc und den Namen."
#   no_agent_line: "Ich weiß nicht, an welchen Agenten. Nenne den Namen zuerst."
#   no_summary_line: "{agent} ist fertig."

# Reading along in AI-Connect (the bridge between agent sessions) and writing to its agents as
# the user, through AI-Connect's program for JSON lines. The user token is typed into the browser
# on each device; the server only hands it on. Remove the leading "#" to switch it on.
# peers:
#   command: [venv/bin/python, -m, observer_client.jsonl]
#   # AI-Connect's folder, where the command runs.
#   directory: ~/Projekte/AI-Connect
#   # Messages of this many past hours are shown when the page opens, at most "limit" of them.
#   hours: 24
#   limit: 300
#   # The agents see what you write as coming from User:<user_name>.
#   user_name: Ada

tmux:
  # Dedicated tmux server socket, so Agent-Orc never touches your own tmux sessions.
  socket_name: agent-orc

# Agent profiles. Command arguments may contain the placeholder {name},
# which is replaced by the name of the folder the agent runs in.
# Claude reports model and context usage through `agent-orc statusline` as its status line, and
# through hooks whether it is working, has finished (agent-idle) or waits for a permission or an
# answer (agent-waiting, which notifies your devices); agent-permission offers each permission
# request on the agent's card too (the terminal still asks; whichever answers first decides);
# agent-tool-done takes a request answered in the terminal off the card again, agent-limited
# plans the resume after a usage limit, agent-compacting and agent-compacted mark an agent that
# shrinks its context as working (no Stop follows it). All only for sessions started by Agent-Orc.
agents:
  claude:
    label: Claude Code
    start: [claude, --settings, "{settings}", --remote-control, "{name}"]
    resume: [claude, --settings, "{settings}", --continue, --remote-control, "{name}"]
    # Every earlier conversation in the folder (also from VS Code or a terminal) can be resumed.
    conversations:
      source: claude
      resume: [claude, --settings, "{settings}", --resume, "{conversation}", --remote-control, "{name}"]
    # Claude's own settings for the agent's settings file ({settings}), which also carries its
    # effort, ultracode and permission mode (only the last --settings counts).
    settings: &claude_settings
      statusLine:
        type: command
        command: agent-orc statusline
      hooks:
        UserPromptSubmit:
        - hooks:
          - type: command
            command: agent-orc agent-busy
        Stop:
        - hooks:
          - type: command
            command: agent-orc agent-idle
        PreCompact:
        - hooks:
          - type: command
            command: agent-orc agent-compacting
        PostCompact:
        - hooks:
          - type: command
            command: agent-orc agent-compacted
        Notification:
        - matcher: permission_prompt|elicitation_dialog
          hooks:
          - type: command
            command: agent-orc agent-waiting
        PermissionRequest:
        - matcher: ''
          hooks:
          - type: command
            command: agent-orc agent-permission
            timeout: 86400
        StopFailure:
        - matcher: rate_limit
          hooks:
          - type: command
            command: agent-orc agent-limited
        PostToolUse:
        - matcher: ''
          hooks:
          - type: command
            command: agent-orc agent-tool-done
            async: true
        PostToolUseFailure:
        - matcher: ''
          hooks:
          - type: command
            command: agent-orc agent-tool-done
            async: true
        PermissionDenied:
        - matcher: ''
          hooks:
          - type: command
            command: agent-orc agent-tool-done
            async: true
    # Starting an agent in a folder means trusting it: skip Claude's trust prompt.
    trust: claude
    # A further agent in the folder gets an AI-Connect name of its own (Host:Project-Suffix).
    env: {AI_CONNECT_PEER_SUFFIX: "{suffix}"}
    # Usage limits (five hours, week) as Claude reports them in its status line.
    quota: claude
    # Reasoning effort of each agent, handed over in its settings file at start.
    effort:
      levels: [low, medium, high, xhigh, max]
      # An agent without a level of its own starts with this one.
      default: medium
      # Ultracode: Claude plans multi-agent workflows for larger tasks by itself.
      ultracode: true
      # A running agent takes a new reasoning in place, without a restart (its background tasks
      # keep running): typed in once it is idle. /effort also rewrites the user's own settings
      # file, which Agent-Orc then puts back as it was.
      live:
        command: /effort {level}
        ultracode_command: /effort ultracode {state}
        protected_file: ~/.claude/settings.json
    # Permission mode each agent starts in (in its settings file): default asks before changes
    # and commands, acceptEdits takes file edits without asking, auto lets Claude decide what is
    # safe, plan only plans. An agent without a mode of its own starts in `default` below; inside
    # a session Shift+Tab switches.
    permission:
      modes: [default, acceptEdits, auto, plan]
      default: auto
  codex:
    label: Codex CLI
    start: [codex]
    resume: [codex, resume, --last]
  aider:
    label: Aider
    start: [aider]
    resume: [aider, --restore-chat-history]
  # A profile may offer a choice of models at start: "models" prints them (one per line), the
  # choice fills {model} in its commands; "effort.levels_command" prints the levels a model takes
  # (nothing: no level at all), "env" sets the agent's environment ({effort}: the folder's level).
  # Example, Claude Code on local models through a wrapper script (lclaude, not shipped); a
  # script for a cloud service with its own models (e.g. Qwen on DashScope) works the same way:
  #
  # claude-local:
  #   label: Claude (local)
  #   hint: Stop other users of the GPUs first, or the models push each other out.
  #   models: [lclaude, --models]
  #   # A running agent takes another model in place (typed into it once it is idle), without a
  #   # restart; Agent-Orc puts the protected file back as the agent rewrote it. Without this,
  #   # changing the model restarts (resumes) the agent.
  #   # Typed into an idle agent to empty or shrink its context without a restart (menu items).
  #   clear_command: /clear
  #   compact_command: /compact
  #   model_live: {command: "/model {model}", confirm: "Switch model?", protected_file: ~/.claude/settings.json}
  #   start: [lclaude, "{model}", --settings, "{settings}"]
  #   resume: [lclaude, "{model}", --settings, "{settings}", --continue]
  #   settings: *claude_settings
  #   env: {LCLAUDE_EFFORT: "{effort}", AI_CONNECT_PEER_SUFFIX: "{suffix}"}
  #   effort:
  #     levels: [low, medium, high, xhigh, max]
  #     default: high
  #     levels_command: [lclaude, --levels, "{model}"]
  #   trust: claude
  shell:
    label: Shell
    # A plain terminal: it may run next to the folder's agent (">_" on its card).
    terminal: true
    # A plain shell in the folder; it has no conversation to resume, resuming opens a new one.
    start: [bash]
    resume: [bash]
