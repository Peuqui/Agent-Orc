# Agent-Orc behind nginx under /agent-orc/ — include inside your HTTPS server block.
# Needs in the http context:  map $http_upgrade $connection_upgrade { default upgrade; '' close; }
location = /agent-orc { return 301 /agent-orc/; }

location /agent-orc/ {
    proxy_pass http://127.0.0.1:8770/;
    proxy_http_version 1.1;
    # Terminal WebSocket.
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    # $http_host keeps a non-default port (e.g. :8443); the terminal compares it with the
    # browser's Origin header, so $host (without port) would refuse every terminal.
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Terminals stay open for a long time and stream output unbuffered.
    proxy_read_timeout 1d;
    proxy_send_timeout 1d;
    proxy_buffering off;
}
